################################################################################
# GitLab CI for the AI Penpot module on git.drupalcode.org.
#
# Uses the Drupal GitLabCI template (the DrupalCI replacement), which provides
# composer, PHPCS, PHPStan and PHPUnit jobs across the supported and adjacent
# core versions with no per-project maintenance. See:
#   https://project.pages.drupalcode.org/gitlab_templates/
################################################################################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # Test against adjacent core versions too, not just the current one.
  OPT_IN_TEST_PREVIOUS_MINOR: 1
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_MAX_PHP: 1
  # No CSS/JS libraries in this module; the webship-js (Playwright + Cucumber)
  # functional suite under tests/ runs in the dedicated webship-js job below.
  SKIP_STYLELINT: 1
  SKIP_ESLINT: 1

# Blocking quality gates: Drupal + DrupalPractice coding standards and PHPStan.
phpcs:
  allow_failure: false

phpstan:
  allow_failure: false

# Spelling is advisory - a dictionary miss should not block the pipeline.
cspell:
  allow_failure: false

# webship-js functional lane. Builds a site with this module, serves it with
# Apache against a real MySQL service, and runs the tests/ webship-js
# (Playwright + Cucumber) BDD suite. Targets the Drupal Canvas AI ecosystem the
# module is built for (Drupal CMS + the Canvas AI stack). No live-LLM (@ai)
# scenarios run in CI - the suite is an always-green functional lane needing no
# provider key.
.webship-js:
  extends: .testing-job-base
  stage: test
  needs: []
  allow_failure: false
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    LAUNCH_URL: "http://localhost"
    LOGIN_USER: "webmaster"
    LOGIN_PASS: "dD.123123ddd"
    HEADLESS: "true"
    BROWSER: "chromium"
    FORCE_COLOR: "1"
    _BUILD_DIR: "/tmp/site-build"
    SITE_PACKAGE: "drupal/cms"
    INSTALL_PROFILE: "drupal_cms_installer"
    EXTRA_REQUIRE: ""
    COMPANION_RECIPE: ""
    ENABLE_MODULES: "ai_penpot"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_REF_NAME =~ /^[0-9]+\.[0-9]+\.x$/'
      when: on_success
    - when: never
  artifacts:
    when: on_failure
    paths:
      - tests/videos
      - tests/screenshots
      - tests/reports
    expire_in: 1 week
  before_script:
    # Node 22 + Playwright (yarn 4 needs node-modules linker; webship-js's
    # postinstall can clobber cucumber.js, so back it up around yarn install).
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    - test -f cucumber.js && cp cucumber.js .cucumber.js.bak || true
    - corepack enable
    - yarn install
    - test -f .cucumber.js.bak && cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak || true
    - ./node_modules/.bin/playwright install --with-deps chromium
    # Build a fresh site with this module via a Composer path repository.
    - composer create-project "$SITE_PACKAGE" $_BUILD_DIR --no-interaction --no-progress
    - cd $_BUILD_DIR
    - composer config minimum-stability dev
    - composer config prefer-stable true
    - composer config allow-plugins true -n
    - composer config repositories.mut '{"type":"path","url":"'"$CI_PROJECT_DIR"'","options":{"symlink":true}}'
    - composer require "drupal/ai_penpot:*@dev" drush/drush $EXTRA_REQUIRE --no-interaction --no-progress
    # Apache serves the built site against the MySQL service.
    - mkdir -pv $_BUILD_DIR/web/sites/default/files $_BUILD_DIR/web/sites/simpletest
    - chmod -R 777 $_BUILD_DIR/web/sites/default/files $_BUILD_DIR/web/sites/simpletest
    - rm -rf /var/www/html && ln -s $_BUILD_DIR/web /var/www/html
    - chown -R www-data:www-data $_BUILD_DIR
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
    # Install, normalise the admin to "webmaster", apply any companion recipe,
    # then enable the module and the ecosystem's modules.
    - $_BUILD_DIR/vendor/bin/drush --root=$_BUILD_DIR/web site:install $INSTALL_PROFILE --db-url=$SIMPLETEST_DB --account-name=webmaster --account-pass=dD.123123ddd --site-name="AI Penpot CI" -y
    - $_BUILD_DIR/vendor/bin/drush --root=$_BUILD_DIR/web php:eval '$u=\Drupal\user\Entity\User::load(1); $u->setUsername("webmaster"); $u->setEmail("webmaster@example.test"); $u->setPassword("dD.123123ddd"); $u->save();'
    - if [ -n "$COMPANION_RECIPE" ]; then RD=$(find $_BUILD_DIR -type f -name recipe.yml -path "*/$COMPANION_RECIPE/*" | head -1); [ -n "$RD" ] && $_BUILD_DIR/vendor/bin/drush --root=$_BUILD_DIR/web recipe "$(dirname "$RD")" -y || echo "recipe $COMPANION_RECIPE not found"; fi
    - $_BUILD_DIR/vendor/bin/drush --root=$_BUILD_DIR/web en $ENABLE_MODULES -y
    - $_BUILD_DIR/vendor/bin/drush --root=$_BUILD_DIR/web cache:rebuild
  script:
    - cd "$CI_PROJECT_DIR"
    - yarn test

# Drupal Canvas AI ecosystem: Drupal CMS + the Canvas AI stack.
'webship-js (Drupal Canvas AI)':
  extends: .webship-js
  variables:
    ENABLE_MODULES: "ai_penpot canvas_ai ai_agents ai_assistant_api"
