ai_penpot.settings:
  type: config_object
  label: 'AI Penpot settings'
  mapping:
    penpot_token_source:
      type: string
      label: 'Token source (Key module)'
    penpot_token_key:
      type: string
      label: 'Key module key id holding the Penpot access token'
    penpot_base_url:
      type: string
      label: 'Penpot instance base URL'
    default_file_id:
      type: string
      label: 'Default Penpot file id'
    build_rules:
      type: text
      label: 'Penpot build rules prompt (generic, theme-agnostic)'
    accessibility_rules:
      type: text
      label: 'Penpot accessibility rules prompt'
    mapping_governance:
      type: text
      label: 'Optional targeted component-mapping governance prompt'
    context_scope:
      type: sequence
      label: 'Scope for seeded AI Context items'
      sequence:
        type: sequence
        sequence:
          type: string
